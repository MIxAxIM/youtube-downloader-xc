name: main

on:
  workflow_dispatch:
  push:
    branches:
      - prime
      - xc
    tags:
      - "*"
  pull_request:
    branches:
      - prime
      - xc

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # Build the project separately to discern between build and format errors
      - name: Build
        run: >
          dotnet build YoutubeDownloader.XC.slnx
          -p:CSharpier_Bypass=true
          --configuration Release

      - name: Verify formatting
        id: verify
        run: >
          dotnet build YoutubeDownloader.XC.slnx
          -t:CSharpierFormat
          --configuration Release
          --no-restore

      - name: Report issues
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        run: echo "::error title=Bad formatting::Formatting issues detected. Please build the solution locally to fix them."

  pack:
    strategy:
      matrix:
        rid:
          - win-arm64
          - win-x86
          - win-x64
          - linux-arm64
          # Linux x86 is not supported by .NET
          # - linux-x86
          - linux-x64
          - osx-arm64
          - osx-x64

    runs-on: ${{ startsWith(matrix.rid, 'win-') && 'windows-latest' || startsWith(matrix.rid, 'osx-') && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Publish app
        run: >
          dotnet publish src/YoutubeDownloader.XC/YoutubeDownloader.XC.csproj
          -p:Version=${{ github.ref_type == 'tag' && github.ref_name || format('999.9.9-ci-{0}', github.sha) }}
          -p:CSharpier_Bypass=true
          -p:EncryptionSalt=${{ secrets.ENCRYPTION_SALT || 'HimalayanPinkSalt' }}
          --output artifacts/publish
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained

      - name: Rename macOS bundle
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        run: mv artifacts/publish/YoutubeDownloaderXC.app artifacts/publish/YoutubeDownloader.XC.app

      - name: Upload app binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YoutubeDownloader.XC.${{ matrix.rid }}
          path: artifacts/publish
          if-no-files-found: error

  release:
    if: ${{ github.ref_type == 'tag' }}

    needs:
      - format
      - pack

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          --repo ${{ github.event.repository.full_name }}
          --title ${{ github.ref_name }}
          --generate-notes
          --verify-tag

  deploy:
    needs: release

    strategy:
      matrix:
        rid:
          - win-arm64
          - win-x86
          - win-x64
          - linux-arm64
          # Linux x86 is not supported by .NET
          # - linux-x86
          - linux-x64
          - osx-arm64
          - osx-x64

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: read
      contents: write

    steps:
      - name: Download app binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: YoutubeDownloader.XC.${{ matrix.rid }}
          path: publish/

      - name: Set permissions
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        run: |
          [ -f publish/YoutubeDownloader.XC ] && chmod +x publish/YoutubeDownloader.XC || true
          [ -f publish/ffmpeg ] && chmod +x publish/ffmpeg || true

          # macOS bundle
          [ -f publish/YoutubeDownloader.XC.app/Contents/MacOS/YoutubeDownloader.XC ] && chmod +x publish/YoutubeDownloader.XC.app/Contents/MacOS/YoutubeDownloader.XC || true
          [ -f publish/YoutubeDownloader.XC.app/Contents/MacOS/ffmpeg ] && chmod +x publish/YoutubeDownloader.XC.app/Contents/MacOS/ffmpeg || true

      - name: Create package
        # Change into the artifacts directory to avoid including the directory itself in the zip archive
        working-directory: publish/
        run: zip -r ../YoutubeDownloader.XC.${{ matrix.rid }}.zip .

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ github.ref_name }}
          YoutubeDownloader.XC.${{ matrix.rid }}.zip
          --repo ${{ github.event.repository.full_name }}
